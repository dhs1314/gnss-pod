# SWARM-A PPP-AR POD V3.2.1 — Satellite-specific Configuration
# =============================================================
# SWARM has 8-channel RUAG GPS receiver (vs 12-ch GRACE-FO BlackJack).
# QC thresholds are relaxed accordingly.

runtime:
  mode: evaluate
  java_home: /usr/lib/jvm/java-17-openjdk
  orekit_data_path: /data/orekit
  output_dir: /data/results

# ── SWARM-A ──
satellite:
  mission: SWARM
  id: A

# ── Dates & Arcs ──
evaluation:
  dates:
    - 2024-04-29
    - 2024-04-30
    - 2024-05-01
    - 2024-05-02
    - 2024-05-03
    - 2024-05-04
    - 2024-05-06
    - 2024-05-07
  arc_hours: [0.17]  # 0.50h available for longer-arc evaluation (Orekit EKF is slower)
  epoch_interval: 30
  min_coverage: 0.0

# ── GPS Products ──
gps_products:
  mode: precise

# ── Observations ──
observations:
  gps1b_pattern: /data/swarm/{date}/GPS1B_{date}_SWARM_{sat_id}.pkl
  gnv1b_pattern: ""
  code_arc_hours: 0.0

# ── Gravity ──
gravity:
  model: GGM05C
  nmax: 150

# ── Force Models ──
dynamics:
  solid_tides: true
  ocean_tides: true
  ocean_tide_degree: 50
  third_body: lunisolar
  srp_model: none           # SWARM: disabled — Orekit eclipse model NPE at high-β orbit
  drag_model: harris-priester
  relativity: true
  dynamics_mode: orekit

# ── EKF (SWARM-adjusted: fewer SVs = relaxed clock + larger prior) ──
ekf:
  sigma_phase: 0.25
  sigma_code: 0.40
  sigma_acc_process: 1.0e-3
  tau_emp: 600.0
  sigma_emp_ss: 1.0e-8
  sigma_zwd_rw: 1.0e-9
  chi2_short: 50
  chi2_long: 200
  el_min_deg: 5.0
  clock_rw_short: 0.0008
  clock_rw_long: 0.002
  elev_exp_phase: 1.0
  elev_exp_code_short: 1.0
  elev_exp_code_long: 0.80
  ar_min_epochs: 5
  mw_max_epochs: 200
  use_phase_windup: true
  use_relativity: true
  use_cycle_slip: true
  dynamics_mode: orekit        # SWARM: Orekit full dynamics in EKF predict (GGM05C 150 + tides + drag)

# ── GN Outer Loop ──
gn_loop:
  max_iter: 6
  damping: 0.5
  prior_r0: 5.0
  prior_v0: 0.05
  prior_emp: 1.0e-7
  dx_tol_pos: 0.005
  dx_tol_vel: 0.0005

# ── Quality Control (SWARM: relaxed for 8-channel RUAG GPS receiver) ──
qc:
  min_sv_coverage: 0.20
  snr_l1_min: 25
  snr_l2_min: 20
  mp_threshold: 4.5
  mw_std_corrupted: 10.0
  mw_std_noisy: 0.60
  mw_std_unstable: 0.80
  wl_fix_residual: 0.45
  nl_fix_residual: 0.35
  robust_reweight: true
  min_wl_epochs: 4
  max_rejected_sv_ratio: 0.90
