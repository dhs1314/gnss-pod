# GRACE-FO PPP-AR POD V3.2.1 — Satellite-specific Configuration
# ============================================================
# CLI overrides: --dates, --hours, --grace-id, --mission, --broadcast, etc.

runtime:
  java_home: /usr/lib/jvm/java-17-openjdk
  orekit_data_path: /data/orekit
  output_dir: /data/results

# ── Satellite ──
satellite:
  mission: GRACE-FO
  id: C

# ── Dates & Arcs ──
evaluation:
  dates:
    - 2024-04-29
    - 2024-04-30
    - 2024-05-01
    - 2024-05-02
    - 2024-05-03
    - 2024-05-04
    - 2024-05-05
    - 2024-05-06
    - 2024-05-08
  arc_hours: [0.17, 0.50]
  epoch_interval: 30
  min_coverage: 0.0

# ── GPS Products ──
gps_products:
  mode: precise     # precise | broadcast

# ── Observations ──
observations:
  code_arc_hours: 0.0

# ── Gravity ──
gravity:
  model: GGM05C
  nmax: 150

# ── Force Models ──
dynamics:
  solid_tides: true
  ocean_tides: true
  ocean_tide_degree: 50
  third_body: lunisolar
  srp_model: isotropic
  drag_model: exponential
  relativity: true
  dynamics_mode: simplified

# ── EKF ──
ekf:
  sigma_phase: 0.20
  sigma_code: 0.30
  sigma_acc_process: 1.0e-3
  tau_emp: 600.0
  sigma_emp_ss: 1.0e-8
  sigma_zwd_rw: 1.0e-9
  chi2_short: 25
  chi2_long: 100
  el_min_deg: 5.0
  clock_rw_short: 0.0004
  clock_rw_long: 0.001
  elev_exp_phase: 1.0
  elev_exp_code_short: 1.0
  elev_exp_code_long: 0.70
  ar_min_epochs: 6
  mw_max_epochs: 200
  use_phase_windup: true
  use_relativity: true
  use_cycle_slip: true

# ── GN Outer Loop ──
gn_loop:
  max_iter: 6
  damping: 0.5
  prior_r0: 1.0
  prior_v0: 0.01
  prior_emp: 1.0e-7
  dx_tol_pos: 0.002
  dx_tol_vel: 0.0002

# ── Quality Control (GRACE-FO optimized) ──
qc:
  min_sv_coverage: 0.40
  snr_l1_min: 30
  snr_l2_min: 25
  mp_threshold: 3.5
  mw_std_corrupted: 10.0
  mw_std_noisy: 0.30
  mw_std_unstable: 0.50
  wl_fix_residual: 0.35
  nl_fix_residual: 0.30
  robust_reweight: true
  min_wl_epochs: 5
  max_rejected_sv_ratio: 0.80    # skip arc if >80% SVs rejected
